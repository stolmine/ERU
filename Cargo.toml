[package]
name = "eru"
version = "0.1.0"
edition = "2021"
description = "EPUB Rename Utility - Extract metadata and rename EPUB files"

[dependencies]
clap = { version = "4", features = ["derive"] }
epub = "2"
walkdir = "2"
dialoguer = "0.11"
thiserror = "2"
chrono = "0.4"
ureq = { version = "2", features = ["json"] }
serde_json = "1"
strsim = "0.11"

[dev-dependencies]
tempfile = "3"
